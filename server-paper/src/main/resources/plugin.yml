name: DoubleJump
version: ${version}
main: pl.doublejump.paper.DoubleJumpPlugin
api-version: '1.21'
description: Serwerowa obsługa podwójnego skoku (walidacja zgłoszeń z moda DoubleJump).
authors: [DoubleJump]
commands:
  doublejump:
    description: Administracja pluginem DoubleJump.
    usage: /<command> <reload|status>
    permission: doublejump.admin
permissions:
  doublejump.use:
    description: Pozwala graczowi korzystać z podwójnego skoku.
    default: true
  doublejump.admin:
    description: Pozwala używać /doublejump reload|status.
    default: op
